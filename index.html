<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Rolling Balls</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F4F2FF'/%3E%3Cpath d='M4 16h24' stroke='%23FF6F7D' stroke-width='5'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            overflow: hidden;
            background: #000;
            height: 100dvh;
            width: 100vw;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        #game {
            position: relative;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
            z-index: 10;
        }
        
        #level-title {
            color: white;
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 4px rgba(0,0,0,0.7);
        }
        
        #progress-container {
            width: 60%;
            height: 10px;
            background: #FFFFFF40;
            border-radius: 5px;
            margin: 0 auto;
            overflow: hidden;
        }
        
        #progress-bar {
            height: 100%;
            background: #3EE6B0;
            width: 0%;
            transition: width 0.3s;
        }
        
        #coin-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
        }
        
        #pause-button {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: max(12px, env(safe-area-inset-left));
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            background: #1B1F55;
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            cursor: pointer;
            pointer-events: auto;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        #pause-button svg { width: 18px; height: 18px; display: block; pointer-events: none; }
        #pause-button .play-tri { display: none; }
        #pause-button.paused .pause-bars { display: none; }
        #pause-button.paused .play-tri { display: block; }
        
        #level-complete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(27, 31, 85, 0.9);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            width: 80%;
            max-width: 300px;
            display: none;
            z-index: 20;
            pointer-events: auto;
        }
        
        #level-complete h2 {
            color: #FFD23F;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        #coins-collected {
            color: white;
            font-size: 20px;
            margin: 20px 0;
        }
        
        #continue-button {
            background: #3EE6B0;
            color: #1B1F55;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            width: 220px;
            height: 64px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .speed-streak {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }
        
        .speed-streak { opacity: 0; transition: opacity 0.2s; }
        .left-streak {
            left: 0; top: 0; height: 100%; width: 8%;
            background: linear-gradient(to right, rgba(255,255,255,0.08), transparent);
        }
        .right-streak {
            right: 0; top: 0; height: 100%; width: 8%;
            background: linear-gradient(to left, rgba(255,255,255,0.08), transparent);
        }
        body { -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
    </style>
</head>
<body>
    <div id="game">
        <div id="ui">
            <div id="level-title">Level 1</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="coin-counter">Coins: 0</div>
            <button id="pause-button" type="button" aria-label="Pause">
                <svg class="pause-bars" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="1" fill="#FFFFFF"/><rect x="11" y="2" width="4" height="14" rx="1" fill="#FFFFFF"/></svg>
                <svg class="play-tri" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 2.5v13l11-6.5L5 2.5z" fill="#FFFFFF"/></svg>
            </button>
        </div>
        <div id="level-complete">
            <h2>Level Complete!</h2>
            <div id="coins-collected">Coins: 0</div>
            <button id="continue-button">Continue</button>
        </div>
        <div class="speed-streak left-streak"></div>
        <div class="speed-streak right-streak"></div>
    </div>
    
    <script src="./vendor/three.min.js"></script>
    <script src="./game.js"></script>
</body>
</html>
