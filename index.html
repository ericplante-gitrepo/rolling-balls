<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Rolling Balls</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            overflow: hidden;
            background: #000;
            height: 100dvh;
            width: 100vw;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        #game {
            position: relative;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
            z-index: 10;
        }
        
        #level-title {
            color: white;
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 4px rgba(0,0,0,0.7);
        }
        
        #progress-container {
            width: 60%;
            height: 10px;
            background: #FFFFFF40;
            border-radius: 5px;
            margin: 0 auto;
            overflow: hidden;
        }
        
        #progress-bar {
            height: 100%;
            background: #3EE6B0;
            width: 0%;
            transition: width 0.3s;
        }
        
        #coin-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
        }
        
        #pause-button {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(27, 31, 85, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            cursor: pointer;
            pointer-events: auto;
        }
        
        #level-complete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(27, 31, 85, 0.9);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            width: 80%;
            max-width: 300px;
            display: none;
            z-index: 20;
        }
        
        #level-complete h2 {
            color: #FFD23F;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        #coins-collected {
            color: white;
            font-size: 20px;
            margin: 20px 0;
        }
        
        #continue-button {
            background: #3EE6B0;
            color: #1B1F55;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            width: 220px;
            height: 64px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .speed-streak {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }
        
        .speed-streak { opacity: 0; transition: opacity 0.2s; }
        .left-streak {
            left: 0; top: 0; height: 100%; width: 8%;
            background: linear-gradient(to right, rgba(255,255,255,0.08), transparent);
        }
        .right-streak {
            right: 0; top: 0; height: 100%; width: 8%;
            background: linear-gradient(to left, rgba(255,255,255,0.08), transparent);
        }
        body { -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
    </style>
</head>
<body>
    <div id="game">
        <div id="ui">
            <div id="level-title">Level 1</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="coin-counter">Coins: 0</div>
            <div id="pause-button">⏸</div>
        </div>
        <div id="level-complete">
            <h2>Level Complete!</h2>
            <div id="coins-collected">Coins: 0</div>
            <button id="continue-button">Continue</button>
        </div>
        <div class="speed-streak left-streak"></div>
        <div class="speed-streak right-streak"></div>
    </div>
    
    <script src="./vendor/three.min.js"></script>
    <script src="./game.js"></script>
</body>
</html>
