<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Build id s3-12: bump the ?v= on both scripts every commit (iPad Safari kept a stale game.js). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3A1D7A">
    <title>Rolling Balls</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F4F2FF'/%3E%3Cpath d='M4 16h24' stroke='%23FF6F7D' stroke-width='5'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            overflow: hidden;
            background: #3A1D7A;
            height: 100%;
            width: 100%;
            touch-action: none;
        }

        body {
            height: 100dvh;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: max(20px, env(safe-area-inset-top)) 20px 20px;
            pointer-events: none;
            z-index: 10;
        }

        #level-title {
            color: white;
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            margin: 0 70px 10px;
            text-shadow: 0 0 4px rgba(0,0,0,0.7);
        }

        #progress-container {
            width: 40%;
            height: 10px;
            background: #FFFFFF40;
            border-radius: 5px;
            margin: 0 auto;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: #3EE6B0;
            width: 0%;
        }

        #coin-counter {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            color: white;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
        }

        #pause-button {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            left: max(12px, env(safe-area-inset-left));
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            background: #1B1F55;
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            cursor: pointer;
            pointer-events: auto;
            padding: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #pause-button svg {
            width: 18px;
            height: 18px;
            display: block;
            pointer-events: none;
        }

        #pause-button .play-tri { display: none; }
        #pause-button.paused .pause-bars { display: none; }
        #pause-button.paused .play-tri { display: block; }

        #level-complete {
            /* VISUAL_GAPS 11: panel sits at the bottom so Continue is bottom centre */
            position: absolute;
            bottom: max(24px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(27, 31, 85, 0.9);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            width: 80%;
            max-width: 300px;
            display: none;
            z-index: 20;
            pointer-events: auto;
        }

        #level-complete h2 {
            color: #FFD23F;
            margin-bottom: 20px;
            font-size: 24px;
        }

        #coins-collected {
            color: white;
            font-size: 20px;
            margin: 20px 0;
        }

        #continue-button {
            background: #3EE6B0;
            color: #1B1F55;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            width: 220px;
            max-width: 100%;
            height: 64px;
            cursor: pointer;
            margin-top: 20px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .speed-streak {
            position: absolute;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .left-streak {
            left: 0;
            top: 0;
            height: 100%;
            width: 8%;
            background: linear-gradient(to right, rgba(255,255,255,0.08), transparent);
        }

        .right-streak {
            right: 0;
            top: 0;
            height: 100%;
            width: 8%;
            background: linear-gradient(to left, rgba(255,255,255,0.08), transparent);
        }

        @media (max-width: 480px) {
            #level-title {
                font-size: 15px;
                margin-left: 45px;
                margin-right: 80px;
                min-height: 36px;
            }
            #coin-counter { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div id="game">
        <div id="ui">
            <div id="level-title">Level 1 · First Roll</div>
            <div id="progress-container" role="progressbar" aria-label="Level progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progress-bar"></div>
            </div>
            <div id="coin-counter">Coins: 0</div>
            <button id="pause-button" type="button" aria-label="Pause">
                <svg class="pause-bars" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="2" width="4" height="14" rx="1" fill="#FFFFFF"/><rect x="11" y="2" width="4" height="14" rx="1" fill="#FFFFFF"/></svg>
                <svg class="play-tri" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 2.5v13l11-6.5L5 2.5z" fill="#FFFFFF"/></svg>
            </button>
        </div>
        <div id="level-complete" role="dialog" aria-modal="true" aria-labelledby="complete-title">
            <h2 id="complete-title">Level Complete!</h2>
            <div id="coins-collected">Coins: 0</div>
            <button id="continue-button" type="button">Continue</button>
        </div>
        <div class="speed-streak left-streak"></div>
        <div class="speed-streak right-streak"></div>
    </div>

    <script src="./vendor/three.min.js?v=s3-13"></script>
    <script src="./game.js?v=s3-13"></script>
</body>
</html>
